# Dev setup: source is bind-mounted so uvicorn --reload picks up code changes
# without a rebuild. Rebuild (`docker compose up -d --build`) is only needed
# for changes to requirements.txt or the Dockerfile.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: lio
      POSTGRES_PASSWORD: lio
      POSTGRES_DB: lio
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lio -d lio"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    image: lio-interview-app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${APP_PORT:-8020}:8000"
    volumes:
      - ./app:/srv/app
      - ./static:/srv/static
      - ./scripts:/srv/scripts
      - ./samples:/data/samples
      - uploads:/data/uploads
    environment:
      # LLM proxy (askLio-extracted runs against an OpenAI-compatible endpoint).
      # The tier is on only when LLM_TIER=on AND LLM_API_KEY is set; without it,
      # manual entry and deterministic parsing still work.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11444}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIER: ${LLM_TIER:-off}
      APPROVAL_THRESHOLD: ${APPROVAL_THRESHOLD:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://lio:lio@db:5432/lio}
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  uploads:
  postgres-data: